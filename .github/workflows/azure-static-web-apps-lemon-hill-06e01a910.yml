name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - APK-Module
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - APK-Module

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install and Build
        run: |
          cd frontend-app
          npm install
          echo "VITE_SUPABASE_URL=https://ealfsxlwpkaogdvddifq.supabase.co" > .env
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhbGZzeGx3cGthb2dkdmRkaWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2NTEzNTIsImV4cCI6MjA5MzIyNzM1Mn0.xz4pxhFFTJ22J4TZ-2Mr7D32hnW02-H3YEY1oAaWUCg" >> .env
          echo "VITE_API_URL=https://odontoja-api.thankfulbay-b13deea5.eastus.azurecontainerapps.io/api" >> .env
          echo "--- checking .env ---"
          grep -c "VITE_SUPABASE_URL=." .env && echo "URL OK" || echo "URL EMPTY"
          grep -c "VITE_SUPABASE_ANON_KEY=." .env && echo "KEY OK" || echo "KEY EMPTY"
          grep -c "VITE_API_URL=." .env && echo "API OK" || echo "API EMPTY"
          npx vite build
          cp staticwebapp.config.json dist/
          echo "--- dist contents ---"
          ls -laR dist/
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_HILL_06E01A910 }}
          action: "upload"
          app_location: "/frontend-app/dist"
          api_location: ""
          output_location: "."
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
